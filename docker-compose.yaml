name: sdp-externals
services:

  # Postgres
  postgres:
    image: postgres:${POSTGRES_VERSION:-latest}
    container_name: 'postgres'
    restart: always
    user: ${POSTGRES_ADMIN_USER}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      SDP_KEYCLOAK_PASSWORD: ${SDP_KEYCLOAK_PASSWORD}                # password for "keycloak" user"
      SDP_DM_USER_PASSWORD: ${SDP_DM_USER_PASSWORD}                  # password for "selfhosted-dm-repo-user" read/write user
      SDP_DM_RO_USER_PASSWORD: ${SDP_DM_RO_USER_PASSWORD}            # password for "selfhosted-dm-repo-user-ro" read-only user
      SDP_DM_DATASOURCE_1_PASSWORD: ${SDP_DM_DATASOURCE_1_PASSWORD}  # password for "datasource-schema-1" user
      SDP_DM_DATASOURCE_2_PASSWORD: ${SDP_DM_DATASOURCE_2_PASSWORD}  # password for "datasource-schema-2" user
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-setup/:/docker-entrypoint-initdb.d/  # Setup scripts execute automatically on first run
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

  # Postgres Web UI
  adminer:
    image: adminer:${POSTGRES_UI_VERSION:-latest}
    container_name: 'adminer'
    environment:
      ADMINER_DEFAULT_SERVER: 'postgres'
    restart: always
    ports:
      - 8090:8080    

  # OpenSearch - single node
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-latest}
    container_name: opensearch
    environment:
      discovery.type: single-node
      node.name: opensearch
      plugins.security.ssl.http.enabled: false  # Allow HTTP for REST API
      plugins.security.allow_default_init_securityindex: true
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-k", "-s", "http://localhost:9200/_plugins/_security/health"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - sdp-local-network

  # OpenSearch Dashboards UI
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_UI_VERSION:-latest} 
    container_name: opensearch-dashboards
    depends_on:
      - opensearch
    ports:
      - 5601:5601 
    expose:
      - "5601" # Expose port 5601 for web access to OpenSearch Dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]' 
    networks:
      - sdp-local-network

  # OpenSearch initialisation via REST API calls 
  opensearch-initialisation:
    image: curlimages/curl:8.9.0
    container_name: opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      ADMIN_USER: ${OPENSEARCH_ADMIN_USER}
      ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      SECURITY_ROLE_NAME: ${OPENSEARCH_SECURITY_ROLE_NAME}
      INTERNAL_USER: ${OPENSEARCH_INTERNAL_USER}
      INTERNAL_USER_PASSWORD: ${OPENSEARCH_INTERNAL_USER_PASSWORD}
    command: ["/bin/sh","/init/initialise.sh"]
    restart: "no"
    volumes:
      - ./opensearch-setup:/init:ro
    networks:
      - sdp-local-network
      
  # Kafka
  kafka:
    image: bitnamilegacy/kafka:${BITNAMI_KAFKA_VERSION:-latest}
    container_name: kafka
    environment:
      KAFKA_ENABLE_KRAFT: yes
      KAFKA_HEAP_OPTS: -Djavax.net.debug=ssl
#      KAFKA_HEAP_OPTS: -Xmx8G -Xms8G -Djavax.net.debug=ssl
#      KAFKA_KRAFT_CLUSTER_ID: ZmYxNjBiYTE0YmQ4NDFhZm
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: 'broker, controller'
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512
      KAFKA_CFG_LISTENERS: BROKER://:9092,CONTROLLER://:9093,INTERNAL://:9094,EXTERNAL://:9095
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: BROKER://kafka:9092,INTERNAL://kafka:9094,EXTERNAL://host.docker.internal:9095
#      KAFKA_CFG_ADVERTISED_LISTENERS: BROKER://kafka:9092,INTERNAL://kafka:9094,EXTERNAL://localhost:9095
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '0@kafka:9093'
      KAFKA_CFG_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CLIENT_LISTENER_NAME: EXTERNAL
      #KAFKA_CFG_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka1" password="kafka1" user_kafka1="kafka1";
      #KAFKA_CFG_LISTENER_NAME_EXTERNAL_SCRAM-SHA-512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka2" password="kafka2" user_kafka1="kafka2";
      KAFKA_CLIENT_USERS: "kafkaadmin"
      KAFKA_CLIENT_PASSWORDS: "kafkaadm1n"
      KAFKA_CFG_SUPER_USERS: "User:kafkaadmin;User:ANONYMOUS"
      KAFKA_CFG_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server kafka:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - sdp-local-network
    ports:
      - '9095:9095'
    volumes:
      - kafka-data:/bitnami/kafka

  # A basic UI for Kafka 
  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - sdp-local-network      

  # Initialise Kafka - One-shot setup job: users, topics, ACLs 
  kafka-initialisation:
    image: bitnamilegacy/kafka:${BITNAMI_KAFKA_VERSION:-latest}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_URL: kafka:9092
      KAFKA_DM_USER: ${KAFKA_DM_USER}
      KAFKA_DM_PASSWORD: ${KAFKA_DM_PASSWORD}
      KAFKA_KEYCLOAK_USER: ${KAFKA_KEYCLOAK_USER}
      KAFKA_KEYCLOAK_PASSWORD: ${KAFKA_KEYCLOAK_PASSWORD}
    entrypoint: ["/bin/bash","-lc"]
    command: ["/init/initialise.sh"]
    restart: "no"
    volumes:
      - kafka-data:/bitnami/kafka
      - ./kafka-setup:/init:ro
    networks:
      - sdp-local-network
  
  # Mailpit for email testing
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    ports:
      - 8025:8025   # Web UI
      - 1025:1025   # SMTP
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: Europe/London

volumes:
  postgres-data:
  kafka-data:
  opensearch-data:
  mailpit-data:

networks:
  sdp-local-network:
    driver: bridge
  