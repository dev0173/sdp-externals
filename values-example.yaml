global:
    # `global.domain` is the main DNS domain used for all ingress hosts and for app access.
    # When performing a local installation, declare this domain in /etc/hosts as well.
    # Example: platform.company.net
    domain: "<YOUR_GLOBAL_DOMAIN>"
    # Protocol used for external URLs
    externalProtocol: "https"
    license:
        # Your license key for the Semarchy Data Platform
        body: "<YOUR_LICENSE_KEY_HERE>"
    image:
        # Container registry for Semarchy Data Platform images
        registry: registry.na.semarchy.net
    smartReload:
        enable: false
    logCollector:
        tls: "on"
        tls_verify: "on"
tenant-settings:
    enabled: true
    user_creation:
        enabled: true
        # Email address of the first admin user
        email: "<YOUR_EMAIL_ADDRESS>"
        # Given name of the first admin user
        firstname: "<YOUR_FIRSTNAME>"
        # Family name of the first admin user
        lastname: "<YOUR_LASTNAME>"
semarchy-iam:
    logCollector:
        tls: "on"
        tlsVerify: "on"
    keycloak:
        config:
            spi:
                eventsListenerKafkaEventListenerPropertiesSecurityProtocol: "SASL_SSL"
            # TLS is terminated at the reverse proxy (e.g. Nginx).
            # Keycloak receives HTTP traffic internally and relies on X-Forwarded-* headers
            # to generate correct HTTPS URLs and secure cookies.
            # Ref documentation: https://www.keycloak.org/server/reverseproxy        
            # Browser â”€â”€ HTTPS â”€â”€> Reverse proxy (like Nginx) â”€â”€ HTTP â”€â”€> Keycloak
            proxyHeaders: xforwarded
            kcHttpEnabled: true                
    ingresses:
        ingress:
        - name: sdp-keycloak
          # Class name of the ingress provider. Example: "nginx" or "traefik"
          className: "<YOUR_INGRESS_CLASS_NAME>"
log-explorer:
    enabled: true
    ingress:
        hosts:
            # Hostname for the Log Explorer UI. Example: selfhosted.platform.company.net
            - host: "selfhosted.<YOUR_GLOBAL_DOMAIN>"
              paths:
                  - path: /log-explorer
                    pathType: ImplementationSpecific
                    className: "<YOUR_INGRESS_CLASS_NAME>"
    log-explorer-service:
        # Number of replicas for the Log Explorer service
        replicaCount: 1
user-profile:
    ingress:
        hosts:
            # Hostname for the User Profile service. Example: selfhosted.platform.company.net
            - host: "selfhosted.<YOUR_GLOBAL_DOMAIN>"
              paths:
                  - path: /user-profile
                    pathType: ImplementationSpecific
                    className: "<YOUR_INGRESS_CLASS_NAME>"
site-admin:
    ingress:
        hosts:
            # Hostname for the Site Admin service. Example: selfhosted.platform.company.net
            - host: "selfhosted.<YOUR_GLOBAL_DOMAIN>"
              paths:
                  - path: /admin
                    pathType: ImplementationSpecific
                    className: "<YOUR_INGRESS_CLASS_NAME>"
welcome:
    ingress:
        hosts:
            # Hostname for the Welcome service. Example: selfhosted.platform.company.net
            - host: "selfhosted.<YOUR_GLOBAL_DOMAIN>"
              paths:
                  - path: /
                    pathType: ImplementationSpecific
                    className: "<YOUR_INGRESS_CLASS_NAME>"
billing-service:
    enabled: true
    opensearch:
        secret:
            # Name of the Kubernetes secret for the OpenSearch connection
            name: opensearch-provider
dm:
    core:
        ingress:
            # Class name of the ingress provider. Example: "nginx" or "traefik"
            className: "<YOUR_INGRESS_CLASS_NAME>"
            hosts:
                # Hostname for the Data Management core service. Example: selfhosted.platform.company.net
                - host: "selfhosted.<YOUR_GLOBAL_DOMAIN>"
            active:
                livenessProbe:
                    # Initial delay for liveness probe (seconds)
                    initialDelaySeconds: 100
                readinessProbe:
                    # Initial delay for readiness probe (seconds)
                    initialDelaySeconds: 100
    logCollector:
        tls: "on"
        tls_verify: "on"